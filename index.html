<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Control de Inventario - Bodega Canasto 1156</title>
    
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#064e3b">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://unpkg.com/html5-qrcode"></script>

    <style>
        @keyframes pulse-ring {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 14px rgba(220, 38, 38, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(220, 38, 38, 0); }
        }
        .animate-bubble-alert {
            animation: pulse-ring 2s infinite ease-in-out;
        }
        input:focus, select:focus {
            outline: none;
            box-shadow: 0 0 0 2px #059669;
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-900 font-sans min-h-screen flex flex-col justify-between">

    <!-- PANTALLA DE INGRESO / REGISTRO -->
    <div id="authScreen" class="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-emerald-950 via-gray-900 to-black">
        <div class="bg-white rounded-2xl shadow-2xl p-6 w-full max-w-md border border-gray-100">
            <div class="text-center mb-6">
                <div class="w-16 h-16 bg-emerald-600 rounded-2xl mx-auto flex items-center justify-center text-white text-3xl shadow-lg mb-3">
                    <i class="fa-solid fa-barcode"></i>
                </div>
                <h1 class="text-2xl font-black text-gray-800 tracking-tight">Bodega Canasto 1156</h1>
                <p class="text-xs font-semibold uppercase text-emerald-600 tracking-wider">Control de Inventario & Alertas SAP</p>
            </div>

            <div class="flex border-b border-gray-200 mb-5">
                <button type="button" id="tabLogin" onclick="switchAuthTab('login')" class="w-1/2 py-2 text-center font-bold text-sm text-emerald-600 border-b-2 border-emerald-600 transition">
                    <i class="fa-solid fa-right-to-bracket mr-1"></i> Ingreso
                </button>
                <button type="button" id="tabRegister" onclick="switchAuthTab('register')" class="w-1/2 py-2 text-center font-bold text-sm text-gray-400 hover:text-gray-600 border-b-2 border-transparent transition">
                    <i class="fa-solid fa-user-plus mr-1"></i> Registro
                </button>
            </div>

            <form id="formLogin" onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Usuario</label>
                    <div class="relative">
                        <i class="fa-solid fa-user absolute left-3 top-3 text-gray-400"></i>
                        <input type="text" id="loginUsername" required placeholder="Ej: lenin" class="w-full pl-10 pr-3 py-2.5 bg-gray-50 border border-gray-300 rounded-xl text-sm font-medium">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Contraseña</label>
                    <div class="relative">
                        <i class="fa-solid fa-lock absolute left-3 top-3 text-gray-400"></i>
                        <input type="password" id="loginPassword" required placeholder="••••••••" class="w-full pl-10 pr-10 py-2.5 bg-gray-50 border border-gray-300 rounded-xl text-sm font-medium">
                        <button type="button" onclick="togglePassVisibility('loginPassword', 'eyeLogin')" class="absolute right-3 top-2.5 text-gray-400 hover:text-gray-600">
                            <i id="eyeLogin" class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                </div>
                <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 active:bg-emerald-800 text-white font-bold py-3 rounded-xl shadow-lg shadow-emerald-600/30 transition text-sm">
                    Ingresar a Bodega <i class="fa-solid fa-arrow-right ml-1"></i>
                </button>
            </form>

            <form id="formRegister" onsubmit="handleRegister(event)" class="space-y-3 hidden">
                <div>
                    <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Nombre Completo</label>
                    <input type="text" id="regName" required placeholder="Ej: Lenin Alexander" class="w-full px-3 py-2.5 bg-gray-50 border border-gray-300 rounded-xl text-sm font-medium">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Nombre de Usuario</label>
                    <input type="text" id="regUsername" required placeholder="Ej: lenin" class="w-full px-3 py-2.5 bg-gray-50 border border-gray-300 rounded-xl text-sm font-medium">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Zona Asignada</label>
                    <select id="regZone" required class="w-full px-3 py-2.5 bg-gray-50 border border-gray-300 rounded-xl text-sm font-medium">
                        <option value="Abarrotes">Pasillo Abarrotes</option>
                        <option value="Lácteos">Pasillo Lácteos</option>
                        <option value="Bebidas">Pasillo Bebidas</option>
                        <option value="Aseo del hogar y personal">Pasillo Aseo del hogar y personal</option>
                        <option value="Congelados">Cavas Congelados</option>
                        <option value="Refrigerados">Cavas Refrigerados</option>
                        <option value="Mecato / Snacks">Pasillo Mecato / Snacks</option>
                        <option value="Todas las Zonas">Todas las Zonas</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Contraseña</label>
                    <div class="relative">
                        <input type="password" id="regPassword" required placeholder="Mínimo 4 caracteres" class="w-full px-3 pr-10 py-2.5 bg-gray-50 border border-gray-300 rounded-xl text-sm font-medium">
                        <button type="button" onclick="togglePassVisibility('regPassword', 'eyeReg')" class="absolute right-3 top-2.5 text-gray-400 hover:text-gray-600">
                            <i id="eyeReg" class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                </div>
                <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl shadow-lg transition text-sm">
                    Guardar y Registrarse <i class="fa-solid fa-check ml-1"></i>
                </button>
            </form>
        </div>
    </div>

    <!-- PANTALLA PRINCIPAL -->
    <div id="mainAppScreen" class="hidden flex-1 flex-col">
        <header class="bg-emerald-900 text-white shadow-md sticky top-0 z-30">
            <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
                <div class="flex items-center space-x-3">
                    <div class="w-9 h-9 rounded-xl bg-emerald-700 flex items-center justify-center font-black text-sm">
                        1156
                    </div>
                    <div>
                        <h2 class="text-sm font-extrabold leading-tight">Canasto 1156</h2>
                        <div class="flex items-center text-[11px] text-emerald-200">
                            <span id="headerUserName" class="font-semibold text-white mr-1">Operario</span> 
                            • <span id="headerUserZone" class="ml-1 text-emerald-300">Zona</span>
                        </div>
                    </div>
                </div>

                <div class="flex items-center space-x-2">
                    <button type="button" onclick="openAlertsModal()" class="relative p-2 bg-emerald-800 hover:bg-emerald-700 rounded-xl text-emerald-100 transition">
                        <i class="fa-solid fa-bell text-sm"></i>
                        <span id="badgeCriticos" class="hidden absolute -top-1 -right-1 bg-red-600 text-white text-[10px] font-bold w-4 h-4 rounded-full flex items-center justify-center animate-bounce">0</span>
                    </button>
                    <button type="button" onclick="handleLogout()" title="Cerrar Sesión" class="p-2 bg-emerald-800 hover:bg-red-700 rounded-xl text-emerald-100 transition">
                        <i class="fa-solid fa-power-off text-sm"></i>
                    </button>
                </div>
            </div>
        </header>

        <main class="max-w-6xl mx-auto w-full p-4 flex-1">
            <div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-200 mb-4 space-y-3">
                <div class="flex flex-col sm:flex-row gap-2">
                    <div class="relative flex-1">
                        <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-gray-400 text-xs"></i>
                        <input type="text" id="searchInput" oninput="renderTable()" placeholder="Buscar por Nombre, Código SAP o EAN..." class="w-full pl-9 pr-3 py-2 bg-gray-50 border border-gray-300 rounded-xl text-xs font-medium">
                    </div>
                    <select id="categoryFilter" onchange="renderTable()" class="px-3 py-2 bg-gray-50 border border-gray-300 rounded-xl text-xs font-semibold text-gray-700">
                        <option value="">Todas las Categorías</option>
                        <option value="Lácteos">Lácteos</option>
                        <option value="Abarrotes">Abarrotes</option>
                        <option value="Bebidas">Bebidas</option>
                        <option value="Aseo del hogar y personal">Aseo del hogar y personal</option>
                        <option value="Congelados">Congelados</option>
                        <option value="Refrigerados">Refrigerados</option>
                        <option value="Mecato / Snacks">Mecato / Snacks</option>
                    </select>
                </div>

                <div class="flex gap-2">
                    <button type="button" onclick="openProductModal()" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 px-4 rounded-xl text-xs flex items-center justify-center shadow-md transition">
                        <i class="fa-solid fa-plus mr-1.5"></i> Registrar Nuevo Producto
                    </button>
                    <button type="button" onclick="openScannerModal('quickSearch')" class="bg-gray-800 hover:bg-black text-white font-bold py-2.5 px-4 rounded-xl text-xs flex items-center justify-center shadow-md transition">
                        <i class="fa-solid fa-camera mr-1.5"></i> Escaneo Rápido
                    </button>
                </div>
            </div>

            <!-- Tabla de Inventario -->
            <div class="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden">
                <div class="p-3 bg-gray-50 border-b border-gray-200 flex justify-between items-center">
                    <h3 class="text-xs font-black uppercase tracking-wider text-gray-700">
                        <i class="fa-solid fa-boxes-stacked mr-1 text-emerald-600"></i> Stock en Bodega
                    </h3>
                    <span id="productCount" class="text-[11px] font-bold bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded-full">0 productos</span>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-xs">
                        <thead class="bg-gray-100 text-gray-600 uppercase font-bold text-[10px] border-b border-gray-200">
                            <tr>
                                <th class="p-3">EAN / SAP</th>
                                <th class="p-3">Producto / Categoría</th>
                                <th class="p-3">Temperatura</th>
                                <th class="p-3">Stock (und / R1 / CX)</th>
                                <th class="p-3">Precios (Und / R1 / CX)</th>
                                <th class="p-3">Vencimiento</th>
                                <th class="p-3 text-center">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="inventoryTableBody" class="divide-y divide-gray-100 font-medium text-gray-700">
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- MODAL REGISTRO / EDICIÓN -->
    <div id="productModal" class="hidden fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-3">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-lg max-h-[92vh] flex flex-col overflow-hidden">
            <div class="p-4 bg-emerald-900 text-white flex justify-between items-center">
                <h3 id="modalTitle" class="font-extrabold text-sm">Nuevo Registro en Inventario</h3>
                <button type="button" onclick="closeProductModal()" class="text-emerald-200 hover:text-white p-1">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <form id="productForm" onsubmit="saveProduct(event)" class="p-4 overflow-y-auto space-y-3 text-xs">
                
                <!-- 1. CÓDIGO DE BARRAS -->
                <div>
                    <label class="block font-bold text-gray-700 uppercase mb-1">1. Código de Barras (EAN)</label>
                    <div class="flex gap-2">
                        <input type="text" id="prodBarcode" required placeholder="Ej: 770123456001" class="flex-1 px-3 py-2 bg-gray-50 border border-gray-300 rounded-xl font-mono text-xs">
                        <button type="button" onclick="openScannerModal('barcode')" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3.5 py-2 rounded-xl" title="Escanear Código de Barras">
                            <i class="fa-solid fa-camera"></i>
                        </button>
                    </div>
                </div>

                <!-- 2. CÓDIGO SAP INTERNO -->
                <div>
                    <label class="block font-bold text-gray-700 uppercase mb-1">2. Código SAP Interno</label>
                    <div class="flex gap-2">
                        <div class="flex-1 flex border border-gray-300 rounded-xl overflow-hidden bg-gray-50">
                            <span class="bg-gray-200 px-3 py-2 text-gray-600 font-bold border-r border-gray-300 select-none">SAP -</span>
                            <input type="text" id="prodSap" required placeholder="10023" class="w-full px-3 py-2 bg-transparent font-mono text-xs">
                        </div>
                        <button type="button" onclick="openScannerModal('sap')" class="bg-blue-600 hover:bg-blue-700 text-white px-3.5 py-2 rounded-xl" title="Escanear Código SAP">
                            <i class="fa-solid fa-camera"></i>
                        </button>
                    </div>
                </div>

                <!-- 3. DESCRIPCIÓN -->
                <div>
                    <label class="block font-bold text-gray-700 uppercase mb-1">3. Descripción del Producto</label>
                    <input type="text" id="prodName" required placeholder="Ej: Leche Entera 1L" class="w-full px-3 py-2 bg-gray-50 border border-gray-300 rounded-xl text-xs">
                </div>

                <!-- 4. CATEGORÍA -->
                <div>
                    <label class="block font-bold text-gray-700 uppercase mb-1">4. Categoría</label>
                    <select id="prodCategory" onchange="handleCategoryChange()" required class="w-full px-3 py-2 bg-gray-50 border border-gray-300 rounded-xl text-xs font-semibold">
                        <option value="Lácteos">Lácteos</option>
                        <option value="Abarrotes">Abarrotes</option>
                        <option value="Bebidas">Bebidas</option>
                        <option value="Aseo del hogar y personal">Aseo del hogar y personal</option>
                        <option value="Congelados">Congelados</option>
                        <option value="Refrigerados">Refrigerados</option>
                        <option value="Mecato / Snacks">Mecato / Snacks</option>
                    </select>
                </div>

                <!-- 5. TEMPERATURA (DISPONIBLE PARA TODOS CON OPCIÓN NO APLICA) -->
                <div>
                    <div class="flex justify-between items-center mb-1">
                        <label class="font-bold text-gray-700 uppercase">5. Temperatura</label>
                        <label class="inline-flex items-center cursor-pointer text-[11px] font-bold text-gray-500">
                            <input type="checkbox" id="tempNA" onchange="toggleTempNA()" class="mr-1.5 accent-emerald-600 rounded"> No aplica
                        </label>
                    </div>
                    <div id="tempInputWrapper" class="flex items-center border border-gray-300 rounded-xl overflow-hidden bg-gray-50">
                        <input type="number" step="0.1" id="prodTemperature" placeholder="Ej: 4 ó -18" class="w-full px-3 py-2 bg-transparent text-xs font-bold">
                        <span class="bg-cyan-100 text-cyan-900 font-black px-3 py-2 border-l border-gray-300">°C</span>
                    </div>
                    <div id="tempNADisplay" class="hidden p-2 bg-gray-100 rounded-xl text-gray-400 font-semibold italic text-xs border border-gray-200">
                        No aplica
                    </div>
                </div>

                <!-- 6. STOCK (UNIDADES) -->
                <div>
                    <label class="block font-bold text-gray-700 uppercase mb-1">6. Stock (Unidades)</label>
                    <div class="flex items-center border border-gray-300 rounded-xl overflow-hidden bg-gray-50">
                        <input type="number" id="prodStock" oninput="syncStock('units')" required min="0" placeholder="0" class="w-full px-3 py-2 bg-transparent text-xs font-bold text-emerald-800">
                        <span class="bg-gray-200 text-gray-700 font-bold px-3 py-2 border-l border-gray-300">und</span>
                    </div>
                </div>

                <!-- 7. STOCK R1 (SIXPACK) CON OPCIÓN NO APLICA -->
                <div>
                    <div class="flex justify-between items-center mb-1">
                        <label class="font-bold text-gray-700 uppercase">7. Stock R1 (Sixpack)</label>
                        <label class="inline-flex items-center cursor-pointer text-[11px] font-bold text-gray-500">
                            <input type="checkbox" id="r1NA" onchange="toggleR1NA()" class="mr-1.5 accent-emerald-600 rounded"> No aplica
                        </label>
                    </div>
                    <div id="r1InputWrapper" class="flex items-center border border-gray-300 rounded-xl overflow-hidden bg-gray-50">
                        <span class="bg-blue-100 text-blue-900 font-black px-3 py-2 border-r border-gray-300 select-none">R1-</span>
                        <input type="number" id="prodR1" oninput="syncStock('r1')" min="0" placeholder="0" class="w-full px-3 py-2 bg-transparent text-xs font-bold">
                    </div>
